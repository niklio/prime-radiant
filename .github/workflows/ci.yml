name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test (PrimeRadiantCore)
        working-directory: ios/PrimeRadiantCore
        run: swift test

  swiftlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: norio-nomura/action-swiftlint@3.2.1

  # The app target (xcodebuild test: unit + snapshot + XCUITest) joins this matrix
  # once ios/project.yml has been generated into a checked-in workflow with signing
  # configured — blocked on the Apple developer account being wired up (M0 note).
