# PrimeRadiant — XcodeGen project spec.
#
# Run `xcodegen generate` in ios/ to produce PrimeRadiant.xcodeproj (XcodeGen writes
# the Info.plist from the `info.properties` blocks below). The .xcodeproj is a build
# artifact and is not checked in.
#
# The app depends on the local SwiftPM package PrimeRadiantCore (tree math, analytics,
# patching, validation). App code never reimplements that math — handoff §4.
name: PrimeRadiant

options:
  bundleIdPrefix: app.primeradiant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PrimeRadiantCore:
    path: PrimeRadiantCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # iPhone-first, iPad via the same adaptive layout rules (handoff §7).
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CODE_SIGN_STYLE: Automatic

targets:
  PrimeRadiant:
    type: application
    platform: iOS
    sources:
      - path: PrimeRadiant
      # Single source of truth lives in /shared — bundle it, never copy-paste it
      # (handoff §7). The system prompt ships verbatim (§5.2); the schemas back
      # the structured-output request and the schema-mirror tests.
      - path: ../shared/prompts/system.md
        buildPhase: resources
        group: SharedResources
      - path: ../shared/schema/model-turn.schema.json
        buildPhase: resources
        group: SharedResources
      - path: ../shared/schema/patch.schema.json
        buildPhase: resources
        group: SharedResources
      - path: ../shared/schema/node.schema.json
        buildPhase: resources
        group: SharedResources
      - path: ../shared/samples/job-offer.json
        buildPhase: resources
        group: SharedResources
      # TODO: vend the OFL font files (Cormorant Garamond Light/SemiBold, IBM Plex
      # Mono Light/Medium) into PrimeRadiant/Resources/Fonts before first build —
      # the PrimeRadiant source path above bundles them automatically once present.
      # Font binaries are not fabricated by tooling; download from the official
      # OFL releases. File names must match UIAppFonts below.
    dependencies:
      - package: PrimeRadiantCore
      - sdk: SceneKit.framework
      - sdk: Speech.framework
      - sdk: AVFoundation.framework
      - sdk: AuthenticationServices.framework
    info:
      path: PrimeRadiant/Resources/Info.plist
      properties:
        CFBundleDisplayName: Prime Radiant
        UILaunchScreen:
          UIColorName: VoidBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # Permission copy in the app's voice (handoff §10): sparse, lowercase-calm,
        # states what happens — no apologies, no exclamation points.
        NSMicrophoneUsageDescription: >-
          the microphone lets you speak to the radiant. audio is transcribed and
          discarded; nothing is recorded.
        NSSpeechRecognitionUsageDescription: >-
          speech recognition turns your voice into words for the radiant.
          on-device recognition is used when available.
        UIAppFonts:
          - CormorantGaramond-Light.ttf
          - CormorantGaramond-SemiBold.ttf
          - IBMPlexMono-Light.ttf
          - IBMPlexMono-Medium.ttf
        CFBundleURLTypes:
          # PKCE OAuth redirect (handoff §2.1). Scheme must match
          # RemoteConfig.oauth.redirectURI. TODO(M2): confirm the registered
          # redirect against OpenAI's app registration before ship.
          - CFBundleURLName: app.primeradiant.oauth
            CFBundleURLSchemes:
              - primeradiant

  PrimeRadiantTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: PrimeRadiantTests
    dependencies:
      - target: PrimeRadiant
      # Direct import of the core package for fixtures/types in tests.
      - package: PrimeRadiantCore

  PrimeRadiantUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: PrimeRadiantUITests
    dependencies:
      - target: PrimeRadiant

schemes:
  PrimeRadiant:
    build:
      targets:
        PrimeRadiant: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrimeRadiantTests
        - PrimeRadiantUITests
